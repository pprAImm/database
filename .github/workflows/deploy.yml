name: Deploy Database

on:
  push:
    branches: [main, feature/db2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/pprAImm/database:latest

      - name: Copy migrations to server
        run: |
          ssh -o StrictHostKeyChecking=no root@185.23.34.25 "mkdir -p /root/migrations"
          scp -o StrictHostKeyChecking=no sql/migrations/*.sql root@185.23.34.25:/root/migrations/

      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no root@185.23.34.25 << 'EOF'
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_TOKEN }}
            docker pull ghcr.io/pprAImm/database:latest
            docker stop database || true
            docker rm database || true
            docker run -d \
              --name database \
              --restart always \
              -p 5432:5432 \
              -v database_data:/var/lib/postgresql/data \
              --env-file /root/.env \
              ghcr.io/pprAImm/database:latest
            docker image prune -f
          EOF

      - name: Run migrations
        run: |
          ssh -o StrictHostKeyChecking=no root@185.23.34.25 << 'EOF'
            sleep 5
            docker exec -i database psql -U admin -d series < /root/migrations/001_init_schema.sql
            docker exec -i database psql -U admin -d series < /root/migrations/002_add_users.sql
          EOF
