name: Deploy Database

on:
  push:
    branches: [main, feature/db2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/ppraimm/database:latest

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy migrations to server
        run: |
          ssh -o StrictHostKeyChecking=no root@139.100.235.63 "mkdir -p /root/migrations"
          scp -o StrictHostKeyChecking=no sql/migrations/*.sql root@139.100.235.63:/root/migrations/

      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no root@139.100.235.63 << 'EOF'
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_TOKEN }}
            docker pull ghcr.io/ppraimm/database:latest
            docker stop database || true
            docker rm database || true
            docker run -d \
              --name database \
              --restart always \
              -p 5432:5432 \
              -v database_data:/var/lib/postgresql/data \
              --env-file /root/.env \
              ghcr.io/ppraimm/database:latest
            docker image prune -f
          EOF

      - name: Run migrations on remote DB
        run: |
          ssh -o StrictHostKeyChecking=no root@139.100.235.63 << 'EOF'
            sleep 5
            for f in /root/migrations/*.sql; do
              echo "Running migration: $f"
              docker exec -i database sh -c 'psql "$DATABASE_URL"' < "$f"
            done
          EOF
