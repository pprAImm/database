name: Deploy Database

on:
  push:
    branches: [main, feature/db2]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build Docker image
        run: docker build -t database:latest .

      - name: Save Docker image
        run: docker save database:latest -o database.tar

      - name: Copy to server
        run: scp -o StrictHostKeyChecking=no database.tar root@185.23.34.25:/root/
      
      - name: Copy migrations to server
        run: |
          ssh -o StrictHostKeyChecking=no root@185.23.34.25 "mkdir -p /root/migrations"
          scp -o StrictHostKeyChecking=no sql/migrations/*.sql root@185.23.34.25:/root/migrations/

      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no root@185.23.34.25 << 'EOF'
            docker volume create database_data 2>/dev/null || true
            docker load -i /root/database.tar
            docker stop database || true
            docker rm database || true
            docker run -d \
              --name database \
              --restart always \
              -p 5432:5432 \
              -v database_data:/var/lib/postgresql/data \
              --env-file /root/.env \
              database:latest
            rm -f /root/database.tar
          EOF

      - name: Run migrations
        run: |
          ssh -o StrictHostKeyChecking=no root@185.23.34.25 << 'EOF'
            # Ждём пока PostgreSQL примет соединения
            sleep 3
            docker exec -i database psql -U admin -d series -f /root/migrations/001_init_schema.sql
            docker exec -i database psql -U admin -d series -f /root/migrations/002_add_users.sql
          EOF
